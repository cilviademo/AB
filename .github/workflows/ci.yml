# AB — Artifact Bench · always-on checks (EXECUTE.md "Always-on checks (CI on every PR)")
#   1. diff-baseline on the static fixtures (the synthetic one is committed; the four corpus fixtures are BLOCKERS B-001)
#   2. GROUND_TRUTH_REPORT.json thresholds for the current phase (fixture built here, Linux variant)
#   3. contract validation of every emitted JSON (write_json validates; the engine suite exercises every stage)
#   4. path-portability and secret scans on a generated bundle (EXPORT stage → GIT_READY)
#   5. vst3host fuzz: 20 hostile inputs must fail with codes 2–5
# Windows-only gates (AB.exe from a clean ZIP, MSVC fixture, PE variant) stay pending-windows in docs/STATUS.md.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHONUNBUFFERED: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  engine-and-static:
    name: engine tests · static engine · diff-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/package-lock.json }
      - run: python -m pip install -e "engine[dev]"
      - run: cd app && npm ci --no-audit --no-fund
      - name: static engine build + tests (verbatim v2 port)
        run: cd app && npx tsc --noEmit -p tsconfig.json && node static-engine/build.mjs && npx vitest run
      - name: engine unit tests (contracts validated on every write)
        run: cd engine && python -m pytest -q
      - name: diff-baseline (synthetic fixture; corpus fixtures blocked B-001)
        run: ab-cli --workspace "$RUNNER_TEMP/ws" --text diff-baseline synthetic
      - name: static-engine self test
        run: node app/static-engine/dist/cli.mjs selftest fixtures/synthetic/SynthPlug.vst3

  ground-truth:
    name: fixture · vst3host · phases 1–2 · one-module proof · export scans
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/package-lock.json }
      - name: JUCE / VST3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev libcurl4-openssl-dev
      - run: python -m pip install -e "engine[dev]"
      - run: cd app && npm ci --no-audit --no-fund && node static-engine/build.mjs
      - name: cache JUCE + VST3 SDK clones
        uses: actions/cache@v4
        with:
          path: |
            fixtures/groundtruth/third_party/JUCE
            native/vst3host/third_party/vst3sdk
          key: sdk-juce-8.0.9-vst3-3.7.9
      - name: build vst3host (VST3 SDK cloned on first run; never vendored — B-002)
        run: native/vst3host/build_all.sh
      - name: build the ground-truth fixture (release + stripped; the stripped build is the recovery input)
        run: AB_VARIANTS="release stripped" fixtures/groundtruth/build_all.sh
      - name: vst3host fuzz + fixture integration (check 5)
        run: cd engine && python -m pytest -q tests/test_runtime_host.py tests/test_behavior.py tests/test_reconstruct.py
      - name: run phases 1–4 on the stripped fixture
        env:
          AB_VST3HOST: ${{ github.workspace }}/native/vst3host/build/vst3host
          AB_JUCE_DIR: ${{ github.workspace }}/fixtures/groundtruth/third_party/JUCE
        run: |
          set -euo pipefail
          WS="$RUNNER_TEMP/gtws"
          ab-cli --workspace "$WS" ingest --context KNOWN_SOURCE_FIXTURE --source-availability KNOWN_SOURCE_GROUND_TRUTH --name ABGroundTruth fixtures/groundtruth/out/stripped/ABGroundTruth.vst3 > ingest.json
          JOB=$(python -c "import json;print(json.load(open('ingest.json'))['data']['jobs'][0]['job_id'])")
          echo "job=$JOB" >> "$GITHUB_ENV"
          ab-cli --workspace "$WS" run "$JOB" --stage INGESTED --stage STATIC_COMPLETE --stage RUNTIME_COMPLETE
          ab-cli --workspace "$WS" --text ground-truth "$JOB" --phase 2
          ab-cli --workspace "$WS" run "$JOB" --stage BEHAVIOR_COMPLETE --stage RECONSTRUCTION_COMPLETE --stage BUILD_COMPLETE --stage VALIDATION_COMPLETE --option quick_probes=true --option skip_pluginval=true
          # phase-3 gates stay PENDING here (Ghidra is not provisioned in CI); no gate may FAIL
          ab-cli --workspace "$WS" --text ground-truth "$JOB" --phase 4 --allow-pending
      - name: export bundle → path-portability + secret scans + GIT_READY (check 4)
        run: |
          set -euo pipefail
          ab-cli --workspace "$RUNNER_TEMP/gtws" run "$job" --stage EXPORT_COMPLETE > export.json
          python - <<'PY'
          import json, sys
          d = json.load(open("export.json"))["data"]
          rec = next(s for s in d["stages"] if s["stage"] == "EXPORT_COMPLETE")
          print(json.dumps(rec["metrics"], indent=1))
          sys.exit(0 if rec["status"] == "OK" and rec["metrics"].get("path_findings", 0) == 0 and rec["metrics"].get("secret_findings", 0) == 0 else 1)
          PY
      - name: upload GROUND_TRUTH_REPORT + validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-truth-report
          path: |
            ${{ runner.temp }}/gtws/Projects/*/06_validation/*.json
            ${{ runner.temp }}/gtws/Projects/*/06_validation/*.md
            ${{ runner.temp }}/gtws/Projects/*/07_agent_handoff/reconstruction_index.json
          if-no-files-found: warn

  shell:
    name: Tauri shell · cargo check (Windows target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci --no-audit --no-fund && npx tsc --noEmit -p tsconfig.json
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: cd app/src-tauri && cargo check --target x86_64-pc-windows-msvc
