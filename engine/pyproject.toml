[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-engine"
version = "0.1.0"
description = "Artifact Bench engine: artifact ingest, recovery, correlation, reverse engineering, reconstruction, transformation, validation, knowledge storage and bundle assembly."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "jsonschema>=4.20",   # contract validation of every emitted JSON (SPEC §17)
  "lief==1.0.0",        # binary inventory (ADDENDUM A1); Apache-2.0
  "capstone==5.0.9",    # function fingerprints before Ghidra (A3); BSD-3
  "yara-python==4.5.4", # candidate-family rules (A4); BSD-3
  "numpy>=1.26",        # behaviour metrics, fits, differential harness
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
similarity = ["py-tlsh==5.0.0"]   # TLSH relatedness signal (A1/A3); optional native build

[project.scripts]
ab-engine = "ab_engine.server:main"
ab-cli = "ab_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# every failure is named and timed in the summary — a failing test must never be an anonymous "1 failed" (B7 reliability)
addopts = "-rfE --durations=5"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
