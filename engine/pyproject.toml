[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-engine"
version = "0.1.0"
description = "AB (Artifact Bench) engine: job system, ingest, correlation, fingerprints, behaviour, reconstruction and bundle assembly for owned plugin recovery."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "jsonschema>=4.20",   # contract validation of every emitted JSON (SPEC §17)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
behavior = ["numpy>=1.26"]   # Phase 4 probes/fits; imported lazily

[project.scripts]
ab-engine = "ab_engine.server:main"
ab-cli = "ab_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
